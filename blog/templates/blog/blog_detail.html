{% extends "catalog/base.html" %}
{% load my_tags %}

{% block create_button %}
<a class="btn btn-primary" href="{% url 'blog:blog_create' %}" role="button">Создать статью</a>
{% endblock %}

{% block content %}
<div class="container">
    <div class="row text-center">
        <div class="col-12 mx-auto">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ blog.heading }}</h4>
                </div>
                <div class="card-body">
                    <img src="{{ blog.heading | media_filter }}" alt="Изображение товара" style="width: 100%; height: auto;" />
                    <h2 class="lead mb-3">Описание: {{ object.content | truncatechars:1000 }}</h2>
                    <h4 class="lead mb-3">Просмотров:{{ object.views_counter }}</h4>
                    <a class="btn btn-md btn-block btn-outline-primary mb-3" href="{% url 'blog:blogs' %}" role="button" >Назад</a>
                </div>
            </div>
        </div>
    </div>
{% endblock%}
