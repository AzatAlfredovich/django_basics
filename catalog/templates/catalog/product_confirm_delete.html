{% extends "catalog/base.html" %}
{% block content %}
<div class="container">
    <div class="row text-center">
        <div class="col-6 mx-auto">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card mb-4 box-shadow">
                    <p class="lead">Действительно хотите удалить: {{ object.name }} ?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    {% if perms.product.can_unpublish_product and perms.product.delete_product or user == product.owner%}
                    <button type="submit" class="btn btn-lg btn-block btn-outline-danger mb-3">Удалить</button>
                    {% endif %}
                    <a class="btn btn-lg btn-block btn-outline-success mb-3" href="{% url 'catalog:home' %}" role="button">Отменить</a>
                </div>
            </form>
        </div>
    </div>
{% endblock%}
