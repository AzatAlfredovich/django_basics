<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <nav class="ms-2 d-flex justify-content-between w-100">
        <!-- Левая часть (Меню) -->
        <div class="d-flex gap-3 ms-lg-5 me-auto">
            <a class="btn btn-outline-primary flex-fill text-truncate" href="{% url 'catalog:home' %}" role="button">Главная</a>
            <a class="btn btn-outline-primary flex-fill text-truncate" href="{% url 'catalog:contacts' %}" role="button">Контакты</a>
            <a class="btn btn-outline-primary flex-fill text-truncate" href="{% url 'blog:blogs' %}" role="button">Блог</a>
        </div>

        <!-- Правая часть (Авторизация и Приветствие) -->
        <div class="d-flex gap-3 ms-auto pe-lg-5 align-items-center">
            <!-- Приветствие -->
            <div class="me-3">
                {% if user.is_authenticated %}
                    <strong>Привет, {{ user.email }}!</strong>
                {% else %}
                    <strong>Добро пожаловать!</strong>
                {% endif %}
            </div>

            <!-- Авторизация -->
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger flex-fill">Выйти</button>
                </form>
            {% else %}
                <a class="btn btn-outline-success flex-fill" href="{% url 'users:login' %}" role="button">Войти</a>
                <a class="btn btn-outline-primary flex-fill" href="{% url 'users:register' %}" role="button">Регистрация</a>
            {% endif %}
        </div>
    </nav>
</div>
