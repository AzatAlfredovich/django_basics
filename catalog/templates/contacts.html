{% extends "base.html" %}
{% block content %}

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Контакты</h1>
</div>

<div class="container">
    <div class="row text-start">
        <div class="col-lg-9 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <table class="table table-striped">
                        <tr>
                            <td class="w-25">Страна</td>
                            <td>Россия</td>
                        </tr>
                        <tr>
                            <td class="w-25">Номер</td>
                            <td>+7 (987) 765 43 21</td>
                        </tr>
                        <tr>
                            <td class="w-25">Адрес</td>
                            <td>ул. Пушкина, д. Колотушкина</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Свяжитесь с нами</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="form-floating">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name">Имя</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Ваше имя" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone">Телефон</label>
                            <input type="text" name="phone" class="form-control" id="phone" placeholder="Контактный телефон" required>
                        </div>
                        <div class="mb-3">
                            <label for="message">Сообщение</label>
                            <textarea type="text" name="message" class="form-control" id="message" placeholder="Текст" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Отправить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock%}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script>
        document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');
    const textarea = document.getElementById('message');
    const resultMessageDiv = document.getElementById('resultMessage');

    // Функция для анимации временного вывода сообщения
    function showSuccessMessage(temporaryText, durationMs) {
        textarea.value = temporaryText;
        setTimeout(() => {
            textarea.value = '';
        }, durationMs);
    }

    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Предотвращаем реальную отправку формы
        let nameValue = document.getElementById('name').value.trim();
        let messageValue = textarea.value.trim();

        if (!nameValue || !messageValue) {
            alert('Заполните все поля!');
            return false;
        }

        // Отправляем AJAX-запрос или выполняем другое действие здесь
        console.log(`Имя: ${nameValue}, Сообщение: ${messageValue}`);

        // Показываем временное сообщение с именем
        showSuccessMessage(`Спасибо, ${nameValue}! Ваше сообщение отправлено!`, 2000); // 2 секунды
    });
});
    </script>
</body>
</html>
